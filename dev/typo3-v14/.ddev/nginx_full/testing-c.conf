# Testing context in the existing DDEV web container. No development database/configuration is used.
server {
    listen 80;
    listen 443 ssl;
    server_name t3exchange-v14-testing-c.ddev.site;
    root /var/www/html/public;
    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
    location = /typo3 { rewrite ^ /typo3/; }
    location /typo3/ {
        try_files $uri /index.php$is_args$args;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_param TYPO3_CONTEXT Testing/PeerC;
        fastcgi_param TYPO3_PATH_APP /var/www/html/var/exchange-testing-c;
        fastcgi_param TYPO3_PATH_ROOT /var/www/html/public;
    }
    location ~ /\. { deny all; }
    location ~* \.(?:sql|log|yaml|yml|ini|sh)$ { deny all; }
}
