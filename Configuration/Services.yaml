services:
  _defaults:
    autowire: true
    autoconfigure: true
  Lizard\Typo3ToTypo3\:
    resource: '../Classes/*'
    exclude: '../Classes/Link/LinkBuilder*.php'
  Lizard\Typo3ToTypo3\Middleware\Resolve:
    public: true
  Lizard\Typo3ToTypo3\Command\ResolveCommand:
    tags:
      - name: console.command
        command: 'exchange:resolve'
        description: 'Resolve a readable page URL through a configured peer'
  Lizard\Typo3ToTypo3\Link\LinkFieldHook:
    public: true
  Lizard\Typo3ToTypo3\Link\LocalRenderer:
    public: true
  Lizard\Typo3ToTypo3\Link\DestinationStore:
    public: true
  Lizard\Typo3ToTypo3\Link\PendingStore:
    public: true
  Lizard\Typo3ToTypo3\Link\RetryWorker:
    public: true
  Lizard\Typo3ToTypo3\Command\RetryCommand:
    tags:
      - name: console.command
        command: 'exchange:retry'
        description: 'Resolve unchanged pending link fields and RTE anchors'
  Lizard\Typo3ToTypo3\Link\RefreshWorker:
    public: true
  Lizard\Typo3ToTypo3\Command\RefreshCommand:
    tags:
      - name: console.command
        command: 'exchange:refresh'
        description: 'Refresh managed destinations by stable identity'
  Lizard\Typo3ToTypo3\Backend\LinkReport:
    public: true
  Lizard\Typo3ToTypo3\Backend\ReportController:
    public: true
  Lizard\Typo3ToTypo3\Backend\EditWarnings:
    public: true
  Lizard\Typo3ToTypo3\Backend\ConnectionToolbar:
    tags:
      - name: backend.toolbar.item
  Lizard\Typo3ToTypo3\Configuration\ConnectionStore:
    public: true
  Lizard\Typo3ToTypo3\Backend\ConnectionsController:
    public: true
